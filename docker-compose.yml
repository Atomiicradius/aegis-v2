x-aegis-env: &aegis-env
  REDIS_URL: redis://redis:6379
  OFFLINE: "1"
  EVENT_POOL: ${EVENT_POOL:-pool}
  VALIDATION_SET: ${VALIDATION_SET:-bounded}
  VALIDATION_K: ${VALIDATION_K:-50}
  LLM_MODE: stub
  LLM_STUB_MS: ${LLM_STUB_MS:-150}
  LEASE_SECONDS: ${LEASE_SECONDS:-30}
  MAX_RETRIES: ${MAX_RETRIES:-3}
  AGING_PER_SEC: ${AGING_PER_SEC:-0.002}
  CRITICAL_THRESHOLD: ${CRITICAL_THRESHOLD:-0.8}
  POLICY: ${POLICY:-fifo}

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    image: aegis-v2
    command: python -m backend.cloud.worker
    depends_on:
      - redis
    environment: *aegis-env

  api:
    image: aegis-v2
    command: uvicorn backend.cloud.api:app --host 0.0.0.0 --port 8000
    depends_on:
      - redis
    ports:
      - "8010:8000"   # host 8010: the original app backend owns :8000
    environment: *aegis-env
